# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số liệu tính bằng src/lab13.py (mục D1). Số có nhãn [simulated] dựa trên cột _simulated hoặc giả định của lab.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; cỡ mẫu = 1.251 x 2,48 = 3.103 mỗi nhóm = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: tối đa 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) x 0,02) >= 859 ra m >= 299 yêu cầu mỗi nhân viên (DE 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (20 nhân viên dùng trợ lý, 20 nhân viên đối chứng)
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần và cùng depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có nguy cơ nhân viên trong cùng depot chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và ghi log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: với 40 nhân viên, không cách chia theo cụm nào đủ mẫu để thấy mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chấp nhận mức chênh phát hiện được là 6 điểm (859 mỗi nhóm). Nếu tác động thật chỉ là 5 điểm thì power còn khoảng 0,64.
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên luật an toàn so với nhóm đối chứng (chênh +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (chi phí mỗi việc thành công 0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x) ra khỏi pilot"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4, 10, rồi 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
