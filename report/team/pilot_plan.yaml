    spillover_risk: "Có nguy cơ chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu 2026-12-14"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt trần tuyệt đối 6% TRONG 1 tuần THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công của cả phạm vi vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-15"
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi phí nhân viên tự làm 12.000 đ (6 phút x 2.000 đ)", "bảng giá token và tool của lab", "chi phí cố định 40 triệu đ mỗi tháng", "mọi chi phí mỗi việc thành công trong file này"]
